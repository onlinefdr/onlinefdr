<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>forms blueprint</title>
</head>
<body>
<!-- Netlify form-detection blueprint. Not linked anywhere; renders blank.
     Registers both forms and every field name so the live forms post against
     a known schema. -->

<form name="intake-safety-screen" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="intake-safety-screen">
  <input name="bot-field">
  <input name="client_name"><input name="matter_type"><input name="contact">
  <input name="w1"><input name="w2"><input name="w3"><input name="w4">
  <input name="s_safe"><input name="s_react"><input name="s_phys"><input name="s_threat">
  <input name="s_control"><input name="s_stalk"><input name="s_order"><input name="s_order_now">
  <input name="s_weapon"><input name="s_escalate">
  <input name="c_safe"><input name="c_exposed"><input name="c_cp"><input name="c_cp_now"><input name="c_withhold">
  <input name="o_concern"><input name="o_order">
  <input name="sh"><input name="sh_now">
  <textarea name="what_would_help"></textarea><textarea name="anything_else"></textarea>
</form>

<form name="callback-request" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="callback-request">
  <input name="bot-field">
  <input name="client_name">
  <input name="phone">
  <input name="best_time">
  <input name="matter">
  <textarea name="note"></textarea>
</form>

<form name="request-a-quote" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="request-a-quote">
  <input name="bot-field">
  <input name="name">
  <input name="phone">
  <input name="email">
  <input name="matter">
</form>

<form name="practitioner-application" method="POST" enctype="multipart/form-data" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="practitioner-application">
  <input name="bot-field">
  <input name="full_name"><input name="email"><input name="mobile"><input name="linkedin">
  <input name="agd_number"><input name="agd_expiry">
  <input name="pi_provider"><input name="pi_policy"><input name="pi_expiry">
  <input type="file" name="pi_certificate">
  <input name="years_practising"><input name="matters_conducted"><input name="matter_types">
  <input name="online_experience"><input name="platforms"><input name="state">
  <input name="capacity"><input name="availability">
  <textarea name="background"></textarea><textarea name="motivation"></textarea>
  <input name="primary_activity"><input name="wwcc"><input name="workspace">
  <input name="registration_clear"><textarea name="complaints_detail"></textarea>
  <input name="how_heard">
  <input name="onboarding_agreed"><input name="workspace_declared"><input name="accuracy_confirmed">
</form>

</body>
</html>
