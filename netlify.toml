# onlinefdr.com.au — Netlify configuration

[build]
  publish = "."

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache: HTML — no cache (always fresh). Pretty URLs (/about/, /) do not end
# in .html, so the rule must target /* to actually apply; the more specific
# /images/* immutable rule below still wins for image requests.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache: images — 1 year
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirects: www to non-www (update once domain is connected)
[[redirects]]
  from = "https://www.onlinefdr.com.au/*"
  to = "https://onlinefdr.com.au/:splat"
  status = 301
  force = true

# Booking vanity paths — clean links for emails, forward to the Google Calendar
# appointment schedules. MUST stay above the /* catch-all or they never fire.
[[redirects]]
  from = "/confidential-intake-90mins"
  to = "https://calendar.app.google/D8umZMhPAMsRacJH6"
  status = 302
  force = true

[[redirects]]
  from = "/confidential-intake-120mins"
  to = "https://calendar.app.google/wyKoLiabRXcGXF4Q9"
  status = 302
  force = true

[[redirects]]
  from = "/book-coaching"
  to = "https://calendar.app.google/b25zgZZNvgioTW1g8"
  status = 302
  force = true

# 404 fallback — serve the branded 404 page with a real 404 status
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
